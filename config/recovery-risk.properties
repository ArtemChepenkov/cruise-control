# Experimental recovery ordering overlay. Append to the deployment's complete
# cruisecontrol.properties when running recovery ordering experiments.
# Select RiskAwareReplicaMovementStrategy with replica_movement_strategies
# on the movement request. The default order below remains task-id based.
replica.movement.strategies=com.linkedin.kafka.cruisecontrol.executor.strategy.BaseReplicaMovementStrategy,com.linkedin.kafka.cruisecontrol.executor.strategy.PostponeUrpReplicaMovementStrategy,com.linkedin.kafka.cruisecontrol.executor.strategy.PrioritizeLargeReplicaMovementStrategy,com.linkedin.kafka.cruisecontrol.executor.strategy.PrioritizeSmallReplicaMovementStrategy,com.linkedin.kafka.cruisecontrol.executor.strategy.PrioritizeMinIsrWithOfflineReplicasStrategy,com.linkedin.kafka.cruisecontrol.executor.strategy.PrioritizeOneAboveMinIsrWithOfflineReplicasStrategy,com.linkedin.kafka.cruisecontrol.executor.strategy.RiskAwareReplicaMovementStrategy
default.replica.movement.strategies=com.linkedin.kafka.cruisecontrol.executor.strategy.BaseReplicaMovementStrategy
recovery.risk.required.copies=3
recovery.risk.required.domains=3
recovery.risk.bandwidth.bytes.per.second=20971520
recovery.risk.critical.weight=100.0
recovery.risk.copy.weight=20.0
recovery.risk.domain.weight=30.0
recovery.risk.aging.period.ms=60000
recovery.risk.aging.bonus=0.1
